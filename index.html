<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f3ec" />
    <title>Jake Fogel</title>
    <style>
      :root {
        --bg-color: #f6f3ec; /* warm off-white */
        --muted: #a29d93;
      }

      html, body {
        margin: 0;
        height: 100%;
        background-color: var(--bg-color);
        touch-action: none; /* a finger drag scrubs the bloom instead of panning */
      }

      main {
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* Resting on the bottom edge, centred */
      .bloom {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        height: min(34vmin, 280px);
        width: auto;
        display: block;
        opacity: 0;
        transition: opacity 0.6s ease;
      }

      .bloom.ready {
        opacity: 1;
      }

      .credit {
        position: fixed;
        bottom: 14px;
        left: 0;
        right: 0;
        text-align: center;
        font: 11px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--muted);
      }

      .credit a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas class="bloom" role="img" aria-label="A flower blooming"></canvas>
    </main>
    <p class="credit" hidden></p>

    <script>
      // Each flower is a folder of transparent frames of just the flower head,
      // bud first, full bloom last, each resting on the bottom edge.
      const FLOWERS = [
        { id: 'crocus', name: 'crocus', frames: 64 },
        {
          id: 'rose',
          name: 'rose',
          frames: 64,
          credit: 'Rose time-lapse by Alex Tr, <a href="https://commons.wikimedia.org/wiki/File:Time-lapse_of_opening_red_rose_isolated_on_black_background.Blooming_red_roses_flower_buds.webm">CC BY 3.0</a>',
        },
      ];

      // How quickly the bloom catches up to the pointer (fraction per 60fps frame)
      const FOLLOW = 0.12;

      const canvas = document.querySelector('.bloom');
      const ctx = canvas.getContext('2d');
      // ?flower=rose pins a specific flower (handy for previewing one)
      const pinned = FLOWERS.find((f) => f.id === new URLSearchParams(location.search).get('flower'));
      const flower = pinned || FLOWERS[Math.floor(Math.random() * FLOWERS.length)];
      canvas.setAttribute('aria-label', `A ${flower.name} blooming`);

      if (flower.credit) {
        const credit = document.querySelector('.credit');
        credit.innerHTML = flower.credit;
        credit.hidden = false;
      }

      // decode() can reject under memory pressure with many large frames,
      // so wait for load and treat decode() as a best-effort warm-up
      const loadFrame = (i) =>
        new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => img.decode().catch(() => {}).then(() => resolve(img));
          img.onerror = reject;
          img.src = `flowers/${flower.id}/${String(i).padStart(3, '0')}.webp`;
        });

      // Cross-fade between neighbouring frames. 'lighter' adds premultiplied
      // pixels, so a·A + (1−a)·B is an exact blend even on transparent edges.
      const draw = (frames, pos) => {
        const i = Math.min(Math.floor(pos), frames.length - 1);
        const t = pos - i;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (t < 0.001 || i === frames.length - 1) {
          ctx.drawImage(frames[i], 0, 0);
          return;
        }
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 1 - t;
        ctx.drawImage(frames[i], 0, 0);
        ctx.globalAlpha = t;
        ctx.drawImage(frames[i + 1], 0, 0);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      };

      // The pointer's horizontal position scrubs the bloom: left edge is the
      // bud, right edge is full bloom.
      let target = 0;
      const follow = (e) => {
        target = Math.min(Math.max(e.clientX / window.innerWidth, 0), 1);
      };
      window.addEventListener('pointermove', follow, { passive: true });
      window.addEventListener('pointerdown', follow, { passive: true });

      Promise.all(Array.from({ length: flower.frames }, (_, i) => loadFrame(i))).then((frames) => {
        const last = frames.length - 1;
        // frames are cropped to the flower head, so the canvas takes their size
        canvas.width = frames[0].naturalWidth;
        canvas.height = frames[0].naturalHeight;
        let shown = target;
        draw(frames, shown * last);
        canvas.classList.add('ready');

        // Ease toward the pointer and only redraw while still catching up
        let prev = null;
        const tick = (now) => {
          const dt = prev === null ? 16.7 : Math.min(now - prev, 100);
          prev = now;
          const gap = target - shown;
          if (Math.abs(gap) > 0.0005) {
            shown += gap * (1 - Math.pow(1 - FOLLOW, dt / 16.7));
            draw(frames, shown * last);
          }
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });
    </script>
  </body>
</html>
